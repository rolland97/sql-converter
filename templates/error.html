<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - SQL Converter</title>
    <link rel="stylesheet" href="/static/styles.css">
    <style>
        .error-container {
            background-color: #ffebee;
            border-left: 4px solid #f44336;
            padding: 20px;
            margin: 20px 0;
            border-radius: 4px;
        }
        
        .error-title {
            color: #d32f2f;
            margin-top: 0;
        }
        
        .back-button {
            display: inline-block;
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            text-decoration: none;
            border-radius: 4px;
            margin-top: 20px;
        }
        
        .back-button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>SQL Converter</h1>
        
        <div class="error-container">
            <h2 class="error-title">Error</h2>
            <p>{{ error_message }}</p>
        </div>
        
        <a href="/" class="back-button">← Return to Home Page</a>
    </div>
</body>
</html>
