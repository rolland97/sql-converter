<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQL Converter</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <!-- Loading overlay -->
    <div class="loading-overlay" id="loading-overlay">
        <div class="loading-container">
            <div class="spinner"></div>
            <div class="loading-text">Processing your request...</div>
        </div>
    </div>

    <div class="container">
        <h1>SQL Converter</h1>
        <div class="tab">
            <button class="tablinks" onclick="openTab(event, 'PHPArray')" id="defaultOpen">PHP Array</button>
            <button class="tablinks" onclick="openTab(event, 'LaravelMigration')">Laravel Migration</button>
        </div>

        <div id="PHPArray" class="tabcontent">
            <h2>SQL to PHP Array Converter</h2>
            <p>Convert your SQL dump to a PHP array with the ability to select which columns to include.</p>
            
            <form action="/analyze/php" method="post" enctype="multipart/form-data">
                <input type="file" name="file" accept=".sql" required>
                <input type="submit" value="Analyze & Select Columns">
            </form>
            
            <div class="divider">OR</div>
            
            <form action="/convert/php" method="post" enctype="multipart/form-data">
                <input type="file" name="file" accept=".sql" required>
                <input type="submit" value="Convert All Columns to PHP Array">
            </form>
        </div>

        <div id="LaravelMigration" class="tabcontent">
            <h2>SQL to Laravel Migration Converter</h2>
            <form action="/convert/laravel" method="post" enctype="multipart/form-data">
                <input type="file" name="file" accept=".sql" required>
                <input type="submit" value="Convert to Laravel Migration">
            </form>
        </div>
    </div>

    <script>
    // Tab functionality
    function openTab(evt, tabName) {
        var i, tabcontent, tablinks;
        tabcontent = document.getElementsByClassName("tabcontent");
        for (i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = "none";
        }
        tablinks = document.getElementsByClassName("tablinks");
        for (i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(" active", "");
        }
        document.getElementById(tabName).style.display = "block";
        evt.currentTarget.className += " active";
    }

    // Get the element with id="defaultOpen" and click on it
    document.getElementById("defaultOpen").click();
    
    // Loading indicator functionality
    document.addEventListener('DOMContentLoaded', function() {
        const forms = document.querySelectorAll('form');
        const loadingOverlay = document.getElementById('loading-overlay');
        
        forms.forEach(form => {
            form.addEventListener('submit', function() {
                // Make sure file is selected
                const fileInput = this.querySelector('input[type="file"]');
                if (fileInput && fileInput.files.length > 0) {
                    loadingOverlay.classList.add('active');
                }
            });
        });
    });
    </script>
</body>
</html>
