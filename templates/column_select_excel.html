<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Columns - SQL to Excel Converter</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <!-- Loading overlay -->
    <div class="loading-overlay" id="loading-overlay">
        <div class="loading-container">
            <div class="spinner"></div>
            <div class="loading-text">Generating Excel Workbook...</div>
        </div>
    </div>
    
    <div class="container">
        <h1>Select Columns for Excel Export</h1>
        <p>Choose which columns you want to include in the generated Excel workbook:</p>
        
        <form action="/convert/excel" method="post" enctype="multipart/form-data" id="columnForm">
            <input type="hidden" name="temp_path" value="{{ temp_path }}">
            <input type="hidden" name="temp_content_path" value="{{ temp_content_path }}">
            <input type="hidden" name="filename" value="{{ filename }}">
            
            <div class="column-select">
                {% for table, columns in table_columns.items() %}
                <div class="table-container">
                    <h3 class="table-title">Table: {{ table }}</h3>
                    <div class="table-actions">
                        <button type="button" class="select-all-btn" data-table="{{ table }}">Select All</button>
                        <button type="button" class="deselect-all-btn" data-table="{{ table }}">Deselect All</button>
                    </div>
                    <div class="column-list">
                        {% for column in columns %}
                        <div class="column-item">
                            <input type="checkbox" id="{{ table }}_{{ column }}" name="{{ table }}_{{ column }}" class="column-checkbox" data-table="{{ table }}" checked>
                            <label for="{{ table }}_{{ column }}" title="{{ column }}">{{ column }}</label>
                        </div>
                        {% endfor %}
                    </div>
                </div>
                {% endfor %}
            </div>
            
            <div class="action-buttons">
                <button type="button" id="select-all" class="button">Select All Columns</button>
                <button type="button" id="deselect-all" class="button">Deselect All Columns</button>
            </div>
            
            <input type="submit" value="Generate Excel Workbook" id="submitBtn">
        </form>
        
        <div class="back-link">
            <a href="/">← Back to Main Page</a>
        </div>
    </div>

    <script src="/static/js/main.js"></script>
</body>
</html>
